[project]
name = "rag-notebook"
version = "0.1.0"
description = "Notebook-grounded retrieval-augmented generation application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.15.0",
  "fastapi>=0.139.2,<0.140",
  "httpx2>=2.9.1,<3",
  "langfuse>=4,<5",
  "openai>=1.0.0",
  "openpyxl>=3.1.5",
  "pillow>=12,<13",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.14.2,<3",
  "pyjwt[crypto]>=2.13,<3",
  "pymupdf>=1.27,<1.28",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "python-multipart>=0.0.20,<1",
  "python-pptx>=1.0.2",
  "qdrant-client>=1.15.0",
  "streamlit>=1.59,<2",
  "uvicorn[standard]>=0.51,<0.52",
]

[project.optional-dependencies]
ocr = [
  "albumentations>=1.4,<2.0",
  "easyocr>=1.7,<2.0",
  "numpy>=1.26,<2",
  "opencv-python-headless>=4.11,<5",
  "paddleocr>=2.10,<3.0",
  "paddlepaddle==3.0.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=app",
  "--cov-branch",
  "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/pipeline/documents/extraction/**/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
files = ["app", "tests"]
